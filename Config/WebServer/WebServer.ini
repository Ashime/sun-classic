[NETWORK]
# This will force the connection to drop when read or write thread(s) have been idle for x-amount of time. Setting this to 0 will disable the disconnect feature.
# DEFAULT: 300 (5 MINUTES)  VALUE: SECONDS
DISCONNECT = 300

[TLS]
# Mutual TLS material for the connection to the Database Server. CERT/KEY identify this server; CA verifies the peer.
# NOTE: These files are generated locally (see Config/WebServer/tls/) and must never be committed to version control.
CERT_PATH = Config/WebServer/tls/web-server.crt
KEY_PATH = Config/WebServer/tls/web-server.key
CA_PATH = Config/tls/ca.crt

[DATABASE_SERVER]
IP = 127.0.0.1
PORT = 10000

[SERVER]
# If IP or PORT has been changed, then please update information in sun-classic database using UpdateServerInfo stored procedure.
IP = 127.0.0.1
PORT = 10003
WORKING_THREADS = 2

[HTTP]
# The port the registration REST API listens on.
PORT = 8080
