[VERSION]
# Found inside CLIENT_INFO.INI in the System.wpk on the SUN client.
CLIENT_VERSION = 2.6.0.1
# Typically found in the bottom left corner of the login/server-select screen on the SUN client. This NEEDS to be checked!
# Original: 3.4.6
CLIENT_PROTOCOL = 7.1.1
# Launcher's version. Found at Config/Launcher/Launcher.ini.
LAUNCHER_VERSION = 1.0.0

[NETWORK]
# Determines whether one connection per IP address is allowed on the client-facing listener.
# Was read by AuthServerConfig but never applied by NioServer until now; the filter used to be
# added unconditionally, so this line had no effect.
# KEEP THIS FALSE FOR LOCAL CLIENT TESTING. The launcher and the game client are both 127.0.0.1,
# and the launcher deliberately holds its AuthServer connection open across the handoff
# (LauncherController#onStartGame). With the filter on, the launcher owns the address and the
# game client is disconnected before it can send U2A_askVerify - see CLIENT-PROTOCOL-NOTES.md
# section 10.
# DEFAULT: TRUE     OPTIONS: TRUE | FALSE
UNIQUE_IP_FILTER = FALSE
# This will force the connection to drop when read or write thread(s) have been idle for x-amount of time. Setting this to 0 will disable the disconnect feature.
# DEFAULT: 300 (5 MINUTES)  VALUE: SECONDS
DISCONNECT = 300

[TLS]
# Mutual TLS material for the connection to the Database Server. CERT/KEY identify this server; CA verifies the peer.
# NOTE: These files are generated locally (see Config/AuthServer/tls/) and must never be committed to version control.
CERT_PATH = Config/AuthServer/tls/auth-server.crt
KEY_PATH = Config/AuthServer/tls/auth-server.key
CA_PATH = Config/tls/ca.crt

[SECURITY]
# This will determine the acceptable amount of time between sending and receiving a packet with a MAC.
# DEFAULT: 300000 (5 MINUTES)   VALUE: MILLISECONDS
HMAC_TIMESTAMP_OFFSET = 300000
# This will force the user to register allowed devices in order to play.
TRUSTED_DEVICES = TRUE

[PROBE]
# DIAGNOSTIC ONLY - it deliberately sends replies known to be wrong. Set FALSE for normal use.
# Serves a different A2U_ansVerify candidate on each U2A_askVerify, to work out what the client
# actually wants back (CLIENT-PROTOCOL-NOTES.md sections 3, 13 and 14).
#
# The opcode sweep is DONE - notes section 14. All 32 opcodes 0x00-0x1F with a 00 body were served
# to a live client and none is accepted as a verify reply. Only 0x0E reacts, and it reacts as
# A2U_ansAuthUser: the client jumps straight to U2A_askSrvList without ever authenticating.
#
# CURRENTLY TRUE with the cursor at 46, so the next client launch serves candidate 47: 0x0E on its
# own with NO re-trigger, which drives the client straight to askSrvList and then leaves it alone.
# That is the state for exercising AnsSrvList against a real client. Set FALSE to go back to the
# normal 33 02 00 reply - but note the client then stops at verify and never reaches the list.
#
# While the probe is on, ClientPacketHandler also serves askSrvList and askSrvSelect to clients
# that never authenticated - it has to, because 0x0E makes the client skip askAuthUser entirely
# (notes section 14.2). That relaxation is tied to this flag, so it is off whenever the probe is.
#
# Opcode-sweep candidates (11-46) are each followed by a 33 00 00 re-trigger, which makes the
# client send another askVerify on the same connection and pull the next candidate - so one launch
# now walks a whole list rather than one entry (notes section 13.1, 14.4). The chain is bounded by
# MAX_PROBE_RETRIGGERS in ClientPacketHandler. Candidates 1-10 do not re-trigger, so their recorded
# results stay comparable.
#
# Candidate map: 1-10 body shapes at opcode 0x02; 11-14 opcode bursts of eight; 15-46 one opcode
# each, where candidate number = 15 + opcode (so 0x0E is candidate 29); 47 is the 0x0E driver.
#
# Read results by pairing the "PROBE serving ..." and "PROBE result: ..." log lines. Judge on
# inbound packets that are NOT another askVerify - "[conn-N] <- 330F" is the client reaching the
# server list. Do NOT judge on close timing; it is not reproducible (notes sections 3.2, 12.2).
# The cursor persists in Config/AuthServer/AnsVerifyProbe.state; delete it to restart the rotation,
# or write a zero-based index to jump to a candidate.
# DEFAULT: FALSE    OPTIONS: TRUE | FALSE
ANS_VERIFY_PROBE = TRUE

[DATABASE_SERVER]
IP = 127.0.0.1
PORT = 10000

[CLIENT]
IP = 127.0.0.1
PORT = 44405
ACCEPT_THREADS = 2
WORKING_THREADS = 2
BUFFER_SIZE = 4096

[SERVER]
# If IP or PORT has been changed, then please update information in sun-classic database using UpdateServerInfo stored procedure.
IP = 127.0.0.1
PORT = 10001
ACCEPT_THREADS = 2
WORKING_THREADS = 10
BUFFER_SIZE = 4096