[NETWORK]
# This will force the connection to drop when read or write thread(s) have been idle for x-amount of time. Setting this to 0 will disable the disconnect feature.
# DEFAULT: 300 (5 MINUTES)  VALUE: SECONDS
DISCONNECT = 300

[TLS]
# Mutual TLS material for accepting connections from other servers. CERT/KEY identify this server; CA verifies the peer.
# NOTE: These files are generated locally (see Config/DatabaseServer/tls/) and must never be committed to version control.
CERT_PATH = Config/DatabaseServer/tls/database-server.crt
KEY_PATH = Config/DatabaseServer/tls/database-server.key
CA_PATH = Config/tls/ca.crt

[SECURITY]
# This will force the database server to create a new AES key and iv. Is RECOMMENDED on setting to TRUE for new setup. Doesn't change account information.
# DEFAULT: FALSE    OPTIONS: TRUE | FALSE
RECREATE_AES_KEY = FALSE
# This will force the database server to create a new HMAC key. RECOMMENDED to set this to TRUE for new setup, otherwise setting this to TRUE for existing servers will force reset passwords for all accounts.
# DEFAULT: FALSE    OPTIONS: TRUE | FALSE
RECREATE_HMAC_KEY = FALSE
# Argon2id cost parameters for password hashing. Changing any of these will force the database to reprocess
# all passwords prior to server start. Tune MEMORY_KB/ITERATIONS to land around 250-500ms per hash on this
# machine - MEMORY_KB is the main defense against GPU/ASIC cracking, so prefer raising it over ITERATIONS.
# DEFAULT: 19456 (19 MiB)
ARGON2_MEMORY_KB = 19456
# DEFAULT: 2
ARGON2_ITERATIONS = 2
# DEFAULT: 1
ARGON2_PARALLELISM = 1
# This will determine the acceptable amount of time between sending and receiving a packet with a MAC.
# DEFAULT: 300000 (5 MINUTES)   VALUE: MILLISECONDS
HMAC_TIMESTAMP_OFFSET = 300000

[SERVER]
# If IP or PORT is changed here, then the [DATABASE_SERVER] sections in the following ini files must be updated: LoginServer.ini, GameServer.ini
IP = 127.0.0.1
PORT = 10000
ACCEPT_THREADS = 5
WORKING_THREADS = 5
BUFFER_SIZE = 4096