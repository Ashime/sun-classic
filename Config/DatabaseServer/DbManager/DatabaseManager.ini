[TASK_EXECUTOR]
# Minimum x-amount of threads the Task Executor will start with.
# DEFAULT: 1    RANGE: 0 or higher
MIN_POOL_SIZE = 1
# Maximum x-amount of threads the Task Executor will use at any time.
# DEFAULT: 20   RANGE: 1 or higher
MAX_POOL_SIZE = 20
# X-amount of time a thread will stay active until killed.
# DEFAULT: 60   VALUE: SECONDS
THREAD_KEEP_ALIVE_TIME = 60
# X-amount of time the Task Executor will wait for tasks to finish before shutting down.
# DEFAULT: 120 (2 MINUTES)  VALUE: SECONDS
MIN_TERMINATION_AWAIT_TIME = 120
# X-amount of time the Task Executor will have until force shutdown occurs.
# DEFAULT: 240 (4 MINUTES)  UNIT: SECONDS
MAX_TERMINATION_AWAIT_TIME = 240

[TASK_SCHEDULER]
# Minimum x-amount of threads the Task Scheduler will start with.
# DEFAULT: 1    RANGE: 0 or higher
MIN_POOL_SIZE = 1
# X-amount of threads the Task Scheduler will add to the pool if a task fails to schedule.
# DEFAULT: 2   RANGE: 1 or higher
ADDITIONAL_POOL_THREADS = 2
# X-amount of time the Task Scheduler will wait for tasks to finish before shutting down.
# DEFAULT: 60 (1 MINUTES)  UNIT: SECONDS
MIN_TERMINATION_AWAIT_TIME = 60
# X-amount of time the Task Scheduler will have until force shutdown occurs.
# DEFAULT: 120 (2 MINUTES)  UNIT: SECONDS
MAX_TERMINATION_AWAIT_TIME = 120