[VERSION]
LAUNCHER_VERSION = 1.0.0

[WINDOW]
TITLE = SUN Classic Launcher
WIDTH = 1080
HEIGHT = 650

[LINKS]
DISCORD = https://discord.gg/
WEBSITE = http://localhost:80
FACEBOOK = https://facebook.com/
REGISTRATION = http://localhost:80/register

[CLIENT]
# Absolute path to the game client executable the START GAME button launches.
# The client is started with its own folder as the working directory, so it resolves
# Data/, GameData.dat and 3dsetup.ini next to this executable - point PATH at the
# Sungame.exe inside the client install you actually want to run.
PATH = C:\Program Files (x86)\WEBZEN\Soul of the Ultimate Nation Classic\Sungame.exe

[GAME_SERVER]
NAME = SUN Classic
# Whether the ConnectServer proxy (client-facing gateway) is currently reachable/enabled.
# This is a static placeholder until the launcher can query live server status.
CONNECT_SERVER_ENABLED = FALSE

[NETWORK]
# This will force the connection to drop when read or write thread(s) have been idle for x-amount of time. Setting this to 0 will disable the disconnect feature.
# DEFAULT: 300 (5 MINUTES)  VALUE: SECONDS
DISCONNECT = 300

[AUTH_SERVER]
# Same host/port as AuthServer.ini's own [CLIENT] section - the launcher's handshake
# (L2A_askUnknown1/A2L_ansReady/A2L_ansVerifyVersion) runs over the same client-facing
# listener the game client itself connects to.
IP = 127.0.0.1
PORT = 44405
WORKER_THREADS = 2

[WEB_SERVER]
# Same host/port as WebServer.ini's own [HTTP] section - the registration form
# (RegistrationController#onSubmit) POSTs to http://IP:PORT/api/register.
IP = 127.0.0.1
PORT = 8080
